<!doctype html>
<!-- The human check run before a prize claim (Cloudflare Turnstile). The website and the apps frame
     this page, from the website's own origin, rather than running the widget themselves: in the iOS
     app Cloudflare fails every check run on the app's tauri:// page. See turnstile.js. -->
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'none'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src https://challenges.cloudflare.com; style-src 'unsafe-inline'"
        />
        <title>OpenChat</title>
        <style>
            html,
            body {
                margin: 0;
                background: transparent;
                overflow: hidden;
            }
        </style>
        <script src="turnstile.js"></script>
    </head>
    <body>
        <div id="widget"></div>
    </body>
</html>
