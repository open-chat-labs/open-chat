[package]
name = "open-chat"
version = "0.1.0"
description = "OpenChat native mobile apps"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri = { workspace = true, features = ["protocol-asset"] }
tauri-plugin-android-fs = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-devtools = { workspace = true, optional = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-oc = { path = "../tauri-plugin-oc" }
url = { workspace = true }

[features]
# Debug telemetry is a separate dependency graph, never part of a default build.
# The development launcher selects this feature for OC_DEVTOOLS=1/true.
devtools = ["dep:tauri-plugin-devtools"]
store = ["tauri-plugin-oc/store"]
# Enables the on-device inference runtime in the bundled app (llama.cpp via the plugin). Off by default so
# normal/dev builds stay fast; the shipping build turns it on (e.g. `cargo tauri build --features inference`).
inference = ["tauri-plugin-oc/inference"]
# Selects the feature-flagged Android Transformers/WebGPU packaging contract. Keep this separate
# from `inference`: ordinary native llama.cpp builds must not accidentally claim the all-WebGPU APK
# contract just because a transient process environment happened to be present.
transformers-webgpu-android = []
