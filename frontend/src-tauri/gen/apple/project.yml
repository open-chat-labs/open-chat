name: open-chat
options:
  bundleIdPrefix: com.oclabs.openchat
  deploymentTarget:
    iOS: 16.0
fileGroups: [../../src]
packages:
  # Push logic the app's plugin and the Notification Service Extension share
  PushCore:
    path: ../../../tauri-plugin-oc/ios/PushCore
  # The inbox the share extension hands shared items to the app through (#10403)
  ShareCore:
    path: ../../../tauri-plugin-oc/ios/ShareCore
  # Native call media (#10445)
  Daily:
    url: https://github.com/daily-co/daily-client-ios
    exactVersion: 0.41.0
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: OpenChat
      PRODUCT_BUNDLE_IDENTIFIER: com.oclabs.openchat
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  open-chat_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Externals holds the rust static libs (Externals/<arch>/<config>/libapp.a),
      # linked via LIBRARY_SEARCH_PATHS + the framework dependency below. It must
      # not be a resource: xcodegen snapshots whatever files exist at generation
      # time, and once dev builds have populated both debug and release libs the
      # copy-resources phase gets two files named libapp.a ("multiple commands
      # produce" build failure).
      - path: Externals
        buildPhase: none
      - path: open-chat_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
      # Required-reason API declarations. Must sit at the bundle root.
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: open-chat_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        NSCameraUsageDescription: OpenChat uses the camera to capture photos and videos for messages and video calls.
        NSMicrophoneUsageDescription: OpenChat uses the microphone for voice messages and calls.
        NSPhotoLibraryUsageDescription: OpenChat shows your recent photos and videos so you can attach them to messages.
        NSPhotoLibraryAddUsageDescription: OpenChat saves photos and videos you download to your photo library.
        NSFaceIDUsageDescription: OpenChat uses Face ID to sign in with your passkey.
        CFBundleURLTypes:
          - CFBundleURLName: openchat
            CFBundleURLSchemes: [openchat]
        # Only OpenChat's own standard encryption (TLS, request signing,
        # passkeys), which is exempt, so uploads skip the export question.
        ITSAppUsesNonExemptEncryption: false
        # Lets the Notification Service Extension make communication notifications
        NSUserActivityTypes: [INSendMessageIntent]
        # A native call keeps going with the app in the background, and PushKit rings it
        UIBackgroundModes: [audio, voip]
        # Dev only: the app loads the vite dev server and talks to a local dfx
        # replica over plain http on the LAN. The iOS release workflow deletes
        # this key before building, so store builds keep ATS on.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      # Not open-chat_iOS.entitlements: tauri-plugin-deep-link's build script rewrites
      # that file's associated domains from the deep-link config, dropping
      # webcredentials (see src-tauri/tests/deepLinkPlugin.spec.ts).
      path: open-chat_iOS/OpenChat.entitlements
      properties:
        # Native passkeys (RP id oc.app). oc.app serves an
        # apple-app-site-association file listing this app id, so devices and
        # simulators fetch it through Apple's CDN. No ?mode=developer suffix:
        # store builds ignore developer-mode entries.
        # Universal links: oc.app links open in the app (#10403).
        com.apple.developer.associated-domains:
          - webcredentials:oc.app
          - applinks:oc.app
        # APNs. Exporting for App Store Connect switches it to production.
        aps-environment: development
        # Message notifications show the sender like a messaging app
        com.apple.developer.usernotifications.communication: true
        # The share extension's inbox
        com.apple.security.application-groups:
          - group.com.oclabs.openchat
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        DEVELOPMENT_TEAM: N59KSS69AU
        CODE_SIGN_STYLE: Automatic
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - target: OpenChatNotificationService
        embed: true
      - target: OpenChatShare
        embed: true
      # Xcode embeds the package's binary framework itself. Embedding it here as well fails the build.
      - package: Daily
        product: Daily
        embed: false
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
      # With an App Store Connect API key, `tauri ios build` archives unsigned and then
      # signs the app itself with entitlements read from open-chat_iOS.entitlements, a
      # path it hard-codes, before the export re-signs it. tauri-plugin-deep-link strips
      # associated domains from that same file while Rust builds (the step above), so it
      # is a generated copy of OpenChat.entitlements, refreshed after every Rust build.
      - script: cp "${SRCROOT}/open-chat_iOS/OpenChat.entitlements" "${SRCROOT}/open-chat_iOS/open-chat_iOS.entitlements"
        name: Copy entitlements for the Tauri signer
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/open-chat_iOS/OpenChat.entitlements
        outputFiles:
          - $(SRCROOT)/open-chat_iOS/open-chat_iOS.entitlements
    # #10398 invariant 18: every extension carries the app's version and build number
    postBuildScripts:
      - script: |
          APP="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}"
          for EXTENSION in "$APP"/PlugIns/*.appex; do
            for KEY in CFBundleShortVersionString CFBundleVersion; do
              EXPECTED=$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$APP/Info.plist")
              ACTUAL=$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$EXTENSION/Info.plist")
              if [ "$EXPECTED" != "$ACTUAL" ]; then
                echo "error: $(basename "$EXTENSION") has $KEY $ACTUAL, the app has $EXPECTED"
                exit 1
              fi
            done
          done
        name: Check extension versions
        basedOnDependencyAnalysis: false
  OpenChatNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: OpenChat
        # Replaced with the app's at build time, see the post-build script
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        # Where avatars are fetched, %@ being the canister id
        OCAvatarBaseUrl: https://%@.raw.icp0.io
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    # The language chosen in the app, which the notifications' text follows (ShareCore's AppLanguage)
    entitlements:
      path: NotificationService/OpenChatNotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.oclabs.openchat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oclabs.openchat.NotificationService
        DEVELOPMENT_TEAM: N59KSS69AU
        CODE_SIGN_STYLE: Automatic
        ARCHS: [arm64]
        SKIP_INSTALL: true
    dependencies:
      - package: PushCore
    postBuildScripts:
      # Sets the version and build number from the app's Info.plist, which the tauri CLI writes
      # before building. Done to the built Info.plist, before the extension is signed.
      - script: |
          for KEY in CFBundleShortVersionString CFBundleVersion; do
            VALUE=$(/usr/libexec/PlistBuddy -c "Print :$KEY" "${SRCROOT}/open-chat_iOS/Info.plist")
            /usr/libexec/PlistBuddy -c "Set :$KEY $VALUE" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          done
        name: Set the app's version
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/open-chat_iOS/Info.plist
      # As the share extension's: keeps the App Group, where the app's language is, through the
      # Tauri signer
      - script: |
          if [ "${CODE_SIGNING_ALLOWED}" = "NO" ]; then
            codesign --force --sign - --timestamp=none \
              --entitlements "${SRCROOT}/NotificationService/OpenChatNotificationService.entitlements" \
              "${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
          fi
        name: Keep the App Group through the Tauri signer
        basedOnDependencyAnalysis: false
  # OpenChat in the share sheet (#10403)
  OpenChatShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: OpenChat
        # Replaced with the app's at build time, see the post-build script
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # What Android's share target takes: text, links, images, videos and files,
            # several at once
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
    entitlements:
      path: ShareExtension/OpenChatShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.oclabs.openchat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oclabs.openchat.Share
        DEVELOPMENT_TEAM: N59KSS69AU
        CODE_SIGN_STYLE: Automatic
        ARCHS: [arm64]
        SKIP_INSTALL: true
    dependencies:
      - package: ShareCore
    postBuildScripts:
      # As the Notification Service Extension's
      - script: |
          for KEY in CFBundleShortVersionString CFBundleVersion; do
            VALUE=$(/usr/libexec/PlistBuddy -c "Print :$KEY" "${SRCROOT}/open-chat_iOS/Info.plist")
            /usr/libexec/PlistBuddy -c "Set :$KEY $VALUE" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          done
        name: Set the app's version
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/open-chat_iOS/Info.plist
      # `tauri ios build` archives with signing off, then signs only the app's binary with its
      # entitlements (the copy phase above). The export re-signs this extension from scratch, and
      # an unsigned binary has no entitlements to keep, so it would lose the App Group the share
      # inbox needs (#10403). An ad hoc signature carries them through; the export replaces it.
      - script: |
          if [ "${CODE_SIGNING_ALLOWED}" = "NO" ]; then
            codesign --force --sign - --timestamp=none \
              --entitlements "${SRCROOT}/ShareExtension/OpenChatShare.entitlements" \
              "${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
          fi
        name: Keep the App Group through the Tauri signer
        basedOnDependencyAnalysis: false
