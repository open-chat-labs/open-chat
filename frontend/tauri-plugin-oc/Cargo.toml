[package]
name = "tauri-plugin-oc"
version = "0.1.0"
edition.workspace = true
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-oc"

[dependencies]
futures-util = "0.3"
mime_guess = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
semver = "1.0"
sha2 = "0.10"
hex = "0.4"
llama-cpp-2 = { version = "0.1.150", optional = true, features = ["mtmd"] }
minijinja = { version = "2", optional = true, features = ["macros"] }
minijinja-contrib = { version = "2", optional = true, features = ["pycompat"] }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-android-fs = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "net", "sync"] }
zip = "2.2.2"

[build-dependencies]
tauri-plugin = { version = "2.4.0", features = ["build"] }

[features]
store = []
# Enables the on-device inference runtime (llama.cpp via llama-cpp-2). Off by default so normal/dev builds
# stay fast and don't require the C++/cmake/libclang toolchain; the shipping app build turns it on.
# Build note: requires cmake + a C/C++ compiler + libclang. On Windows, if a Visual Studio version newer
# than the `cmake` crate understands is the latest installed (it auto-picks the newest and can panic with
# "doesn't know how to generate cmake files for it"), pin an installed, supported toolset via the env var
# CMAKE_GENERATOR="Visual Studio 17 2022".
# Build the image (mtmd/CLIP) path with an optimised profile (`--release`): unoptimised debug builds of
# llama.cpp's vision C++ are not only very slow but can abort with a stack-check failure on Windows. The
# text path runs fine in debug; the shipping app build is release, so this is naturally satisfied.
inference = ["dep:llama-cpp-2", "dep:minijinja", "dep:minijinja-contrib"]
