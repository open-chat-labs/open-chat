name: Deploy Notifications Pusher

on:
  workflow_dispatch: # Trigger manually! On a notification pusher tag to deploy it, or on master to deploy the latest one

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-notification-pusher

jobs:
  build-and-deploy:
    # The pusher runs as an ECS service on Fargate, arm64, so it's built on arm
    runs-on: ubuntu-24.04-arm
    env:
      IMAGE: 253040722768.dkr.ecr.us-east-1.amazonaws.com/notification-pusher

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get the tag to deploy and extract version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ "$GITHUB_REF_NAME" = "master" ]; then
            TAG=$(git tag --list "*-notification_pusher" "*-notifications_pusher" | sort -V | tail -1)
          else
            echo "Run this on master or on a notification pusher tag!"
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-notifications?_pusher$ ]]; then
            echo "No notification pusher tag to deploy (got '$TAG')!"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$TAG" origin/master; then
            echo "$TAG isn't on master!"
            exit 1
          fi

          echo "Tag to deploy: $TAG"

          NEW_VERSION=$(echo "$TAG" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+)-.*/\1/')
          echo "Version extracted: $NEW_VERSION"

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Check out the tag's code
        run: git worktree add "$RUNNER_TEMP/pusher" "${{ steps.version.outputs.tag }}"

      - name: Set up Rust
        uses: ./.github/workflows/setup-rust

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add musl target
        working-directory: ${{ runner.temp }}/pusher
        run: rustup target add aarch64-unknown-linux-musl

      - name: Build
        working-directory: ${{ runner.temp }}/pusher
        run: cargo build --locked --package notification_pusher_aws --release --target=aarch64-unknown-linux-musl

      # With master's Dockerfile and entrypoint, as a tag made before the move to ECS has neither
      - name: Build the image
        run: |
          CONTEXT=$(mktemp -d)
          cp "$RUNNER_TEMP/pusher/target/aarch64-unknown-linux-musl/release/notification_pusher_aws" \
            backend/notification_pusher/aws/Dockerfile \
            backend/notification_pusher/aws/entrypoint.sh \
            "$CONTEXT"
          docker build --platform linux/arm64 -t "$IMAGE:${{ steps.version.outputs.version }}" -t "$IMAGE:latest" "$CONTEXT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::253040722768:role/GitHubActions-DeployNotificationPusher
          aws-region: us-east-1

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push the image
        run: |
          docker push "$IMAGE:${{ steps.version.outputs.version }}"
          docker push "$IMAGE:latest"

      - name: Render the task definition
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend/notification_pusher/aws/task-definition.json
          container-name: notification-pusher
          image: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}

      # The service runs one task, and stops it before starting the new one, so two pushers never
      # run at once
      - name: Deploy
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          cluster: openchat
          service: notification-pusher
          wait-for-service-stability: true

      # The service also settles if the deployment circuit breaker rolled back to the old version
      - name: Check the new version is running
        run: |
          read -r RUNNING STATE <<< "$(aws ecs describe-services --cluster openchat --services notification-pusher \
            --query 'services[0].deployments[?status==`PRIMARY`] | [0].[taskDefinition, rolloutState]' --output text)"
          echo "Running $RUNNING ($STATE)"
          [[ "$RUNNING" == "${{ steps.deploy.outputs.task-definition-arn }}" && "$STATE" == "COMPLETED" ]]
