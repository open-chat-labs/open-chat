on:
  pull_request:
    branches:
      - master
      - codex/pr1-local-models
  push:
    branches:
      - codex/pr1-local-models
      - codex/pr2-app-chat-interfaces
      - codex/pr2-clean-integration
  workflow_dispatch:

name: Frontend linting, type check & unit tests

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Restore dependencies from cache
        uses: actions/cache/restore@v3
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"

      - name: Install dependencies
        run: npm ci --no-audit

        # A missing platform package is a lockfile failure, not permission to rewrite it in CI.
      - name: Verify locked Rollup Linux Binary
        run: node -e "require('@rollup/rollup-linux-x64-gnu')"

      - name: Verify OTA archive prerequisites
        run: |
          command -v zip
          command -v unzip

      - name: Check PR and release policy regressions
        working-directory: .
        run: node --test scripts/pr-ci-policy.test.mjs scripts/app_model_integration.test.mjs scripts/message_content_candid_contract.test.mjs scripts/validate_action_inbox_wiring.test.mjs scripts/android_release_policy.test.mjs scripts/android_release_checks.test.mjs scripts/release_preflight.test.mjs scripts/upgrade_canister.test.mjs scripts/android_bundle.test.mjs scripts/android_build_prerequisites.test.mjs scripts/frontend_format_check.test.mjs scripts/android_dev.test.mjs scripts/verify_webgpu_distribution.test.mjs scripts/model_asset_notices.test.mjs scripts/sbom_lock_identity.test.mjs scripts/model_ci_coverage.test.mjs scripts/security_mode_scope.test.mjs

      # Pure local fixtures only: no advisory requests, installs, or live model runs.
      - name: Check offline feature inventory and CI contracts
        working-directory: .
        run: node --test scripts/npm_feature_scope.test.mjs scripts/npm_feature_seed_review.test.mjs scripts/npm_feature_advisories.test.mjs scripts/npm_feature_advisories.review.test.mjs scripts/rust_feature_scope.test.mjs scripts/rust_feature_seed_review.test.mjs scripts/rust_feature_advisories.test.mjs scripts/rust_feature_advisory_results.test.mjs scripts/rust_feature_advisory_runner.test.mjs scripts/rust_feature_sbom.test.mjs scripts/rust_feature_sbom_validate.test.mjs scripts/rust_feature_collection.test.mjs scripts/rust_feature_ci.test.mjs scripts/check_feature_ci.test.mjs scripts/security_mode_scope.test.mjs scripts/security_owned_rules.test.mjs

      - name: Verify narrowly scoped dependency compatibility
        working-directory: .
        run: |
          node scripts/cdp_axios_compatibility.mjs
          node scripts/decoder_compatibility.mjs
          node scripts/onnx_adm_zip_compatibility.mjs
          node scripts/transformers_sharp_compatibility.mjs

      - name: Install the repository-pinned dfx build prerequisite
        uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365
        with:
          dfx-version: "0.31.0-beta.1"

      - name: Verify dfx is available for the public-key query
        run: dfx --version

      - name: Build frontend
        run: npm run build:ci
        env:
          NODE_ENV: ci
          OC_USERGEEK_APIKEY: DUMMY_USERGEEK_APIKEY
          OC_ROLLBAR_ACCESS_TOKEN: DUMMY_ROLLBAR_ACCESS_TOKEN
          OC_WEBSITE_VERSION: 1.0.0
          OC_METERED_APIKEY: DUMMY_METERED_APIKEY
          OC_VAPID_PUBLIC_KEY: DUMMY_VAPID_PUBLIC_KEY

      # A candidate build proves immutable asset packaging, not deployment approval
      # or physical-device inference. The default production build stays separate.
      - name: Build and verify the opt-in production WebGPU candidate
        run: |
          npm run build:prod
          node ../scripts/verify_webgpu_distribution.mjs app/build
        env:
          NODE_ENV: ci
          OC_USERGEEK_APIKEY: DUMMY_USERGEEK_APIKEY
          OC_ROLLBAR_ACCESS_TOKEN: DUMMY_ROLLBAR_ACCESS_TOKEN
          OC_WEBSITE_VERSION: 1.0.0
          OC_METERED_APIKEY: DUMMY_METERED_APIKEY
          OC_VAPID_PUBLIC_KEY: DUMMY_VAPID_PUBLIC_KEY
          OC_TRANSFORMERS_WEBGPU_IMAGE_SPIKE: "true"
          OC_TRANSFORMERS_WEBGPU_ASSET_DELIVERY: immutable-hub-v1

      - name: Save dependencies to cache
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@v3
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
