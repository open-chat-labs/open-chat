on:
  pull_request:
    branches:
      - master

name: Frontend linting, type check & unit tests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Restore dependencies from cache
        uses: actions/cache/restore@v3
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"

      - name: Install dependencies
        run: npm ci

        # A missing platform package is a lockfile failure, not permission to rewrite it in CI.
      - name: Verify locked Rollup Linux Binary
        run: node -e "require('@rollup/rollup-linux-x64-gnu')"

      - name: Verify OTA archive prerequisites
        run: |
          command -v zip
          command -v unzip

      - name: Check OTA archive packaging
        working-directory: .
        run: node --test scripts/android_bundle.test.mjs

      - name: Install the repository-pinned dfx build prerequisite
        uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365
        with:
          dfx-version: "0.31.0-beta.1"

      - name: Verify dfx is available for the public-key query
        run: dfx --version

      - name: Build frontend
        run: npm run build:ci
        env:
          NODE_ENV: ci
          OC_USERGEEK_APIKEY: DUMMY_USERGEEK_APIKEY
          OC_ROLLBAR_ACCESS_TOKEN: DUMMY_ROLLBAR_ACCESS_TOKEN
          OC_WEBSITE_VERSION: 1.0.0
          OC_METERED_APIKEY: DUMMY_METERED_APIKEY
          OC_VAPID_PUBLIC_KEY: DUMMY_VAPID_PUBLIC_KEY

      - name: Save dependencies to cache
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@v3
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
