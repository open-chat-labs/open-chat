on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - codex/pr1-local-models
  workflow_dispatch:

name: Frontend linting, type check & unit tests

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Restore dependencies from cache
        uses: actions/cache/restore@v3
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"

      - name: Install dependencies
        run: npm ci

        # A missing platform package is a lockfile failure, not permission to rewrite it in CI.
      - name: Verify locked Rollup Linux Binary
        run: node -e "require('@rollup/rollup-linux-x64-gnu')"

      - name: Verify OTA archive prerequisites
        run: |
          command -v zip
          command -v unzip

      - name: Check model and packaging policy regressions
        working-directory: .
        run: node --test scripts/android_bundle.test.mjs scripts/android_build_prerequisites.test.mjs scripts/android_dev.test.mjs scripts/model_asset_notices.test.mjs scripts/verify_webgpu_distribution.test.mjs scripts/model_ci_coverage.test.mjs scripts/sbom_lock_identity.test.mjs scripts/frontend_format_check.test.mjs

      - name: Verify narrowly scoped dependency compatibility
        working-directory: .
        run: |
          node scripts/cdp_axios_compatibility.mjs
          node scripts/decoder_compatibility.mjs
          node scripts/onnx_adm_zip_compatibility.mjs
          node scripts/transformers_sharp_compatibility.mjs

      - name: Install the repository-pinned dfx build prerequisite
        uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365
        with:
          dfx-version: "0.31.0-beta.1"

      - name: Verify dfx is available for the public-key query
        run: dfx --version

      - name: Build frontend
        run: npm run build:ci
        env:
          NODE_ENV: ci
          OC_USERGEEK_APIKEY: DUMMY_USERGEEK_APIKEY
          OC_ROLLBAR_ACCESS_TOKEN: DUMMY_ROLLBAR_ACCESS_TOKEN
          OC_WEBSITE_VERSION: 1.0.0
          OC_METERED_APIKEY: DUMMY_METERED_APIKEY
          OC_VAPID_PUBLIC_KEY: DUMMY_VAPID_PUBLIC_KEY

      # Packaging evidence only: this does not deploy or verify device inference.
      # Keep the default production build separate from this opt-in candidate.
      - name: Build and verify the opt-in production WebGPU candidate
        run: |
          npm run build:prod
          node ../scripts/verify_webgpu_distribution.mjs app/build
        env:
          NODE_ENV: ci
          OC_USERGEEK_APIKEY: DUMMY_USERGEEK_APIKEY
          OC_ROLLBAR_ACCESS_TOKEN: DUMMY_ROLLBAR_ACCESS_TOKEN
          OC_WEBSITE_VERSION: 1.0.0
          OC_METERED_APIKEY: DUMMY_METERED_APIKEY
          OC_VAPID_PUBLIC_KEY: DUMMY_VAPID_PUBLIC_KEY
          OC_TRANSFORMERS_WEBGPU_IMAGE_SPIKE: "true"
          OC_TRANSFORMERS_WEBGPU_ASSET_DELIVERY: immutable-hub-v1

      - name: Save dependencies to cache
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@v3
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
