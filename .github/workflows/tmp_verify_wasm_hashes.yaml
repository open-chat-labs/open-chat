# TEMPORARY (to be removed before merging): checks whether building each canister on its own (via
# the Dockerfile's canister_name arg) reproduces the wasm hashes that master's "Push canister
# wasms" job published for 7acf9ddad, and how long each build takes on a free runner
on:
  pull_request:
    paths:
      - ".github/workflows/tmp_verify_wasm_hashes.yaml"

name: TMP verify wasm hashes

jobs:
  verify_single:
    name: Verify ${{ matrix.canister }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        canister: [airdrop_bot,community,cycles_dispenser,daily_puzzle,escrow,event_relay,group,group_index,identity,local_user_index,market_maker,multi_user,neuron_controller,notifications_index,online_users,openchat_installer,proposal_validation,proposals_bot,registry,sign_in_with_email,storage_bucket,storage_index,translations,user,user_index]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply this PR's changes on top of 7acf9ddad
        run: |
          git diff origin/master HEAD -- Dockerfile scripts/ > /tmp/pr.patch
          git checkout 7acf9ddad46957f8a289632071ebde26fd8d3525
          git apply /tmp/pr.patch
      - name: Build ${{ matrix.canister }}
        run: |
          docker build -t openchat --build-arg git_commit_id=$(git rev-parse HEAD) --build-arg canister_name=${{ matrix.canister }} --platform linux/amd64 .
          container_id=$(docker create openchat)
          docker cp $container_id:/build/wasms wasms
      - name: Compare with the published hash
        run: |
          name=${{ matrix.canister }}.wasm.gz
          curl -sfSL -o /tmp/$name https://openchat-canister-wasms.s3.amazonaws.com/7acf9ddad46957f8a289632071ebde26fd8d3525/$name
          ours=$(sha256sum wasms/$name | cut -d' ' -f1)
          theirs=$(sha256sum /tmp/$name | cut -d' ' -f1)
          echo "ours=$ours published=$theirs"
          [ "$ours" == "$theirs" ]
