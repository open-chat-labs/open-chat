on:
  pull_request:
    branches:
      - master

name: Benchmarks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Frontend-only PRs have nothing here to check. The jobs below are required status checks, so
  # they must still run on every PR (a workflow-level `paths:` filter would leave the checks
  # pending and the PR unmergeable); instead they skip themselves when nothing they depend on
  # changed. A skipped job satisfies branch protection.
  #
  # The filter must name every input of these jobs, not just Rust sources. The same block lives
  # in backend.yaml, candid.yaml and benchmarks.yaml; keep the three identical.
  changes:
    name: detect backend changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - "**.rs"
              - "**.toml"
              - "**.did"
              - "**/Cargo.lock"
              - "canbench*.yml"
              - "scripts/**"
              - ".github/workflows/**"

  benchmarks:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-rust
        with:
          cache: read

      - name: Benchmark
        run: |
          bash ./scripts/ci-run-benchmarks.sh . ${{ github.job }}

      - uses: actions/upload-artifact@v4
        with:
          name: canbench_result_${{github.job}}
          path: /tmp/canbench_result_${{ github.job }}

      - name: Save PR number
        run: |
          echo ${{ github.event.number }} > /tmp/pr_number

      - uses: actions/upload-artifact@v4
        with:
          name: pr_number
          path: /tmp/pr_number

      - name: Pass or fail
        run: |
          bash ./scripts/ci-post-run-benchmarks.sh
