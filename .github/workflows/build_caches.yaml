on:
  push:
    branches:
      - master
    # The inputs of the Rust and wasm builds: a cache is only worth rebuilding when something
    # that feeds a build has changed
    paths:
      - "**.rs"
      - "**.toml"
      - "**.did"
      - "**/Cargo.lock"
      - "scripts/generate-all-canister-wasms.sh"
      - "scripts/build-benchmarks-wasm.sh"
      - "scripts/build-candid-generators.sh"
      - "canbench.yml"
      - ".github/workflows/setup-rust/**"
      - ".github/workflows/build_caches.yaml"

name: Build caches

jobs:
  # Warms the cache the PR checks restore (backend.yaml, candid.yaml, benchmarks.yaml). Each step
  # below matches the command a PR job runs, because cargo only reuses an artifact when the
  # command that produced it had the same profile, target and flags. The cache keeps the
  # dependencies only: workspace crates are always rebuilt by the PR jobs.
  build_all_debug:
    name: Build all in debug mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-rust
        with:
          cache: write

      # The unit tests
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: --workspace --exclude open-chat --exclude tauri-plugin-oc --tests

      # Clippy checks the dependencies in `check` mode, whose artifacts are separate from the
      # `build` ones above; without this step it re-checks every dependency on every PR
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --workspace --exclude open-chat --exclude tauri-plugin-oc --tests

      # The candid check builds the generator binaries as a set of their own, which unifies the
      # dependency features differently from the workspace-wide builds above
      - name: Build candid generators
        run: ./scripts/build-candid-generators.sh

      # The benchmarks: `canbench` itself (built from source, so a couple of minutes if it is not
      # already in the cached ~/.cargo/bin) and the wasm dependencies it builds
      - name: Install canbench
        run: cargo install canbench --version 0.6.0
      - name: Build benchmarks wasm
        run: ./scripts/build-benchmarks-wasm.sh

  # Warms the cache the integration tests restore: the canister wasms, `ic-wasm`, and the debug
  # build of the test crate. Uses the same runner spec as the integration tests so the cached
  # artifacts are built at the same paths with the same toolchain.
  build_wasms_and_integration_tests:
    name: Build wasms and integration tests
    runs-on:
      - runs-on
      - cpu=16
      - image=ubuntu24-full-x64
      - family=m7i
      - run-id=${{ github.run_id }}
    steps:
      - name: Install Rustup
        run: |
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -fsSL "https://sh.rustup.rs" | sh -s -- --default-toolchain none -y
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-rust
        with:
          cache: write
          shared-key: build-wasm
      - uses: arduino/setup-protoc@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build canister wasms
        run: ./scripts/generate-all-canister-wasms.sh
      - name: Build integration tests
        run: cargo test --package integration_tests --no-run
