on:
  pull_request:
    branches:
      - master

# If two events are triggered within a short time in the same PR, cancel the run of the oldest event
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

name: Validate candid files

jobs:
  # Frontend-only PRs have nothing here to check. The jobs below are required status checks, so
  # they must still run on every PR (a workflow-level `paths:` filter would leave the checks
  # pending and the PR unmergeable); instead they skip themselves when nothing they depend on
  # changed. A skipped job satisfies branch protection.
  #
  # The filter must name every input of these jobs, not just Rust sources. The same block lives
  # in backend.yaml, candid.yaml and benchmarks.yaml; keep the three identical.
  changes:
    name: detect backend changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - "**.rs"
              - "**.toml"
              - "**.did"
              - "**/Cargo.lock"
              - "canbench*.yml"
              - "scripts/**"
              - ".github/workflows/**"

  candid_syntax:
    name: validate candid syntax
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install didc 0.3.2
        uses: supplypike/setup-bin@v1
        with:
          uri: https://github.com/dfinity/candid/releases/download/2023-07-11/didc-linux64
          name: didc
          version: 0.3.2
      - name: run validate-candid-syntax.sh
        run: ./scripts/validate-candid-syntax.sh
        shell: bash

  candid_matches_rust:
    name: validate candid matches rust
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-rust
        with:
          cache: read
      - name: install didc 0.3.2
        uses: supplypike/setup-bin@v1
        with:
          uri: https://github.com/dfinity/candid/releases/download/2023-07-11/didc-linux64
          name: didc
          version: 0.3.2
      - name: run validate-candid-matches-rust.sh
        run: ./scripts/validate-candid-matches-rust.sh
        shell: bash
