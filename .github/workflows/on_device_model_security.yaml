name: On-device model security

on:
  pull_request:
    branches: [master, codex/pr1-local-models]
    paths:
      - ".github/dependabot.yml"
      - ".github/security/openchat-pr1-security-baseline.json"
      - ".github/security/openchat-pr2-security-baseline.json"
      - ".github/workflows/frontend.yaml"
      - ".github/workflows/android_release.yaml"
      - ".github/workflows/on_device_model_security.yaml"
      - ".gitattributes"
      - "Cargo.lock"
      - "Cargo.toml"
      - "dfx.json"
      - "frontend/**/package.json"
      - "frontend/package-lock.json"
      - "frontend/.npmrc"
      - "frontend/vitest.config.ts"
      - "frontend/vite-env.d.ts"
      - "frontend/global.d.ts"
      - "frontend/app/.ic-assets.json5"
      - "frontend/app/vitest.config.ts"
      - "frontend/app/vite.config.ts"
      - "frontend/app/tsconfig.json"
      - "frontend/app/src/bootstrapSecurity*"
      - "frontend/app/src/utils/model*"
      - "frontend/app/src/utils/onDeviceInference*"
      - "frontend/app/src/utils/nativeInferenceRuntimeBridge*"
      - "frontend/app/src/utils/imageDimensions*"
      - "frontend/app/src/utils/webInference*"
      - "frontend/app/src/utils/webGpuModelCatalog*"
      - "frontend/app/public/model-catalog.json"
      - "frontend/app/src/utils/transformersWebGpu*"
      - "frontend/app/src/utils/fixtures/qwenVisionGeometry.native.json"
      - "frontend/app/src/utils/gemma4WebGpu*"
      - "frontend/app/src/utils/localAi*"
      - "frontend/app/src/utils/localAudioInput*"
      - "frontend/app/src/utils/configuredLocalBlobUrl*"
      - "frontend/app/src/utils/localImageInput*"
      - "frontend/app/src/utils/inferenceImage*"
      - "frontend/app/src/stores/customModels*"
      - "frontend/app/src/stores/onDeviceModels*"
      - "frontend/app/src/stores/transformersWebGpu*"
      - "frontend/app/src/stores/webGpuModelCatalog*"
      - "frontend/app/src/workers/transformersWebGpu*"
      - "frontend/app/src/components*/**/ModelManager.svelte"
      - "frontend/app/src/components_shared/WebInferenceRuntimeSettings*"
      - "frontend/app/src/components_shared/WebGpuModelCatalog*"
      - "frontend/app/src/components/home/MessageEntry.svelte"
      - "frontend/app/src/components_mobile/home/MessageEntry.svelte"
      - "frontend/app/transformersWebGpu*"
      - "frontend/app/build*"
      - "frontend/app/rollup*"
      - "frontend/app/modelAssetNotices.mjs"
      - "frontend/app/publicKeyBuild*"
      - "frontend/app/src/publicKeyBuild*"
      - "frontend/app/model-asset-notices/**"
      - "frontend/app/model-overrides/**"
      - "frontend/openchat-shared/src/domain/onDeviceModel*"
      - "frontend/openchat-agent/src/services/registry/modelCatalog*"
      - "frontend/openchat-client/src/openchat.ts"
      - "frontend/openchat-worker/src/worker.ts"
      - "frontend/openchat-shared/src/domain/worker.ts"
      - "frontend/openchat-agent/src/services/openchatAgent.ts"
      - "frontend/openchat-agent/src/services/storageBucket/publicBlob*"
      - "frontend/openchat-agent/src/services/storageBucket/storageBucket.client.ts"
      - "frontend/src-tauri/**"
      - "frontend/tauri-plugin-oc/**"
      - "scripts/check_openchat_pr1_security.mjs"
      - "scripts/security_dependency_hash*"
      - "scripts/security_mode_scope*"
      - "scripts/npm_feature*"
      - "scripts/rust_feature*"
      - "scripts/vendor/cyclonedx-1.6/**"
      - "scripts/check_feature_ci*"
      - "scripts/security_owned_rules*"
      - "scripts/sbom_lock_identity*"
      - "scripts/model_ci_coverage*"
      - "scripts/model_asset_notices*"
      - "scripts/verify_webgpu_distribution*"
      - "scripts/frontend_format_check*"
      - "scripts/android_dev*"
      - "scripts/android_bundle*"
      - "scripts/android_build_prerequisites*"
      - "scripts/android_component_identity_tools*"
      - "scripts/cdp_axios_compatibility.mjs"
      - "scripts/decoder_compatibility.mjs"
      - "scripts/onnx_adm_zip_compatibility.mjs"
      - "scripts/transformers_sharp_compatibility.mjs"
      - "scripts/pr-ci-policy.test.mjs"
  push:
    branches:
      [
        codex/pr1-local-models,
        codex/pr2-app-chat-interfaces,
        codex/pr2-clean-integration,
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-policy:
    name: Dependency delta, advisories, licenses and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend lockfile
        working-directory: frontend
        run: npm ci --no-audit
      - name: Verify historical reviewed dependency hash portability
        run: node --test scripts/security_dependency_hash.test.mjs
      - name: Check candidate source and config formatting
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check_openchat_pr1_security.mjs format
      - name: Test scoped npm ownership, collection and advisory contracts offline
        working-directory: .
        run: node --test scripts/npm_feature_scope.test.mjs scripts/npm_feature_seed_review.test.mjs scripts/npm_feature_advisories.test.mjs scripts/npm_feature_advisories.review.test.mjs scripts/check_feature_ci.test.mjs scripts/security_mode_scope.test.mjs scripts/security_owned_rules.test.mjs
      - name: Check partial npm CI wiring and exact Node runtime
        working-directory: .
        run: node scripts/check_feature_ci.mjs npm-pr1
      - name: Query advisories only for reviewed model dependency roots
        working-directory: .
        # Arborist 9.4.0 and semver 7.7.4 are verified by the scoped runner.
        # Source, seeds, install mode and lock identities are checked before/after.
        run: |
          set -euo pipefail
          npm_root="$(npm root --global)"
          node scripts/npm_feature_advisories.mjs --repository-root "$GITHUB_WORKSPACE" --scope pr1 --arborist-path "$npm_root/npm/node_modules/@npmcli/arborist" --output-directory "$RUNNER_TEMP" --mode query-bulk
      - name: Upload scoped model npm evidence, including failed checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openchat-pr1-scoped-npm-report
          path: ${{ runner.temp }}/npm-feature-advisories-*
          if-no-files-found: error
      - name: Prepare locked Rust metadata inputs explicitly
        working-directory: .
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          cargo_path="$(rustup which --toolchain 1.95.0 cargo)"
          rustc_path="$(rustup which --toolchain 1.95.0 rustc)"
          RUSTC="$rustc_path" "$cargo_path" fetch --locked
      - name: Check introduced model dependency licenses offline
        working-directory: .
        # Fails closed if locked Cargo metadata is not already cached.
        run: node scripts/check_openchat_pr1_security.mjs licenses
      # The additive PR2 Rust gate runs once in openchat_pr2_security.yaml.
      # PR1's model-only Rust inventory is checked in its own source slice.

  android-component-contracts:
    name: Android component identity host contracts and SDK compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.1"
      - name: Test the pinned tool resolver and CI coverage offline
        run: node --test scripts/android_component_identity_tools.test.mjs scripts/model_ci_coverage.test.mjs
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install the Android API used by the component contracts
        run: sdkmanager "platforms;android-36"
      - name: Compile actual component sources and run host and SDK contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolsJson = & node scripts/android_component_identity_tools.mjs --output-directory "$env:RUNNER_TEMP/openchat-component-tools"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned component test tool resolution failed.' }
          $tools = $toolsJson | ConvertFrom-Json
          & ./frontend/tauri-plugin-oc/android/component-identity-tests/run.ps1 `
            -JavaHome $env:JAVA_HOME `
            -KotlinCompilerClasspath $tools.compilerClasspath `
            -KotlinRuntimeClasspath $tools.runtimeClasspath `
            -JUnitClasspath $tools.junitClasspath `
            -AndroidJar "$env:ANDROID_HOME/platforms/android-36/android.jar" `
            -OutputDirectory "$env:RUNNER_TEMP/openchat-component-classes"
          if ($LASTEXITCODE -ne 0) { throw 'Component identity contracts failed.' }
        # Host recording doubles plus real Android API compilation, not device
        # notification/authentication or APK/signing evidence. No Tauri init.

  native-hermetic:
    name: Native hermetic tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux desktop build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf libclang-dev cmake
      - name: Run downloader, store and boundary unit tests
        run: cargo test --locked -p tauri-plugin-oc --lib
      - name: Compile both shipping app feature sets (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo check --locked -p open-chat --features inference
          cargo check --locked -p open-chat --features inference,store
      - name: Compile both shipping app feature sets (Windows)
        if: runner.os == 'Windows'
        env:
          CMAKE_GENERATOR: Visual Studio 17 2022
        run: |
          cargo check --locked -p open-chat --features inference
          cargo check --locked -p open-chat --features inference,store

  frontend-contracts:
    name: Frontend model contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend lockfile
        working-directory: frontend
        run: npm ci --no-audit
      - name: Run all local-model frontend contracts
        working-directory: frontend
        # Vitest uses literal path filters, not shell globs. Prefixes also select
        # Gemma/audio/lifecycle/build variants and future suites in these families.
        run: >-
          npm test --
          app/rollup-plugin-wasm-url
          app/src/publicKeyBuild
          app/src/stores/customModels
          app/src/stores/onDeviceModels
          app/src/stores/transformersWebGpu
          app/src/components_shared/WebInferenceRuntimeSettings
          app/src/components_shared/WebGpuModelCatalog
          app/src/utils/localAi
          app/src/utils/localAudioInput
          app/src/utils/configuredLocalBlobUrl
          app/src/utils/localImageInput
          app/src/utils/inferenceImage
          app/src/utils/model
          app/src/utils/onDeviceInference
          app/src/utils/nativeInferenceRuntimeBridge
          app/src/utils/imageDimensions
          app/src/utils/webInference
          app/src/utils/webGpuModelCatalog
          app/src/utils/transformersWebGpu
          app/src/utils/gemma4WebGpu
          app/src/bootstrapSecurity
          openchat-agent/src/services/storageBucket/publicBlob

  real-text-inference:
    name: Real inference with pinned 14 MB fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux desktop and llama.cpp prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf libclang-dev cmake
      - name: Download and verify immutable MIT-licensed GGUF fixture
        env:
          MODEL_SHA256: a439d0bbdce924ff1a32f68b7b2dd7fa0b98687f7eb6e7e55206527b446362af
          MODEL_URL: https://huggingface.co/tensorblock/tinyllama-15M-stories-GGUF/resolve/227c5a5ad3c1a830901543cf9959c53572014a68/tinyllama-15M-stories-Q4_0.gguf
        run: |
          mkdir -p "$RUNNER_TEMP/openchat-model-fixture"
          model_path="$RUNNER_TEMP/openchat-model-fixture/tinyllama-15M-stories-Q4_0.gguf"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --max-filesize 13893600 "$MODEL_URL" --output "$model_path"
          echo "$MODEL_SHA256  $model_path" | sha256sum --check --strict
          test "$(stat --format=%s "$model_path")" = "13893600"
          echo "OC_TEST_MODEL_GGUF=$model_path" >> "$GITHUB_ENV"
      - name: Run an actual inference (ignored tests must be selected explicitly)
        run: >-
          cargo test --locked -p tauri-plugin-oc --features inference
          inference::tests::text_inference_smoke --
          --ignored --exact --nocapture
