# Runs on every push to master. On other branches (eg. PRs) they can be triggered manually via
# "Run workflow" on the Actions tab.
on:
  push:
    branches:
      - master
    paths:
      - "**.rs"
      - "**.toml"
      - "**/Cargo.lock"
      - "scripts/run-integration-tests.sh"
      - "scripts/generate-all-canister-wasms.sh"
      - ".github/workflows/setup-rust/**"
      - ".github/workflows/integration_tests.yaml"
  workflow_dispatch:

name: Integration tests

# Master pushes each get their own group so that every commit to master is tested. Manual runs
# on the same branch cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  integration_tests:
    name: run integration tests
    runs-on:
      - runs-on
      - cpu=16
      - image=ubuntu24-full-x64
      - family=m7i
      - run-id=${{ github.run_id }}
    steps:
      - name: Install Rustup
        run: |
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -fsSL "https://sh.rustup.rs" | sh -s -- --default-toolchain none -y
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-rust
        with:
          cache: read
          shared-key: build-wasm
      - uses: arduino/setup-protoc@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Builds the wasms natively (incrementally, from the cache written on master by
      # build_caches.yaml) rather than from scratch in docker. Reproducible builds only matter
      # for releases, which still go through docker.
      - name: Build canister wasms and run integration tests
        run: ./scripts/run-integration-tests.sh build
