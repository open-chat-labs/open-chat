# Runs on every push to master. On other branches (eg. PRs) they can be triggered manually via
# "Run workflow" on the Actions tab. Manual runs test the branch head as-is (not merged with
# master), so re-run after rebasing if master has moved on.
on:
  push:
    branches:
      - master
    paths:
      - "**.rs"
      - "**.toml"
      - "**/Cargo.lock"
      # The tiny canisters written in wat, whose committed wasms are checked against them
      - "**.wat"
      - "**.wasm"
      - "scripts/run-integration-tests.sh"
      - "scripts/generate-all-canister-wasms.sh"
      - "scripts/generate-test-wasms.sh"
      - "scripts/cached-download.sh"
      - "scripts/download-canister-wasm.sh"
      - "scripts/download-canister-wasm-dfx.sh"
      - "scripts/download-nns-canister-wasm.sh"
      - ".github/workflows/setup-rust/**"
      - ".github/workflows/integration_tests.yaml"
  workflow_dispatch:

name: Integration tests

# Master pushes each get their own group so that every commit to master is tested. Manual runs
# on the same branch cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  integration_tests:
    name: run integration tests
    runs-on:
      - runs-on
      - cpu=16
      - image=ubuntu24-full-x64
      - family=m7i
      - run-id=${{ github.run_id }}
    steps:
      - name: Install Rustup
        run: |
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -fsSL "https://sh.rustup.rs" | sh -s -- --default-toolchain none -y
      - uses: actions/checkout@v4
      # The master runs write the cache which every run restores. It's only saved when its key (the
      # manifests, lockfile and toolchain) has changed, so after a key change the first master run
      # to finish saves it (runs which started before then try too, and fail harmlessly). Runs whose
      # tests fail save it as well: they nearly always fail after the build has finished, and
      # saving only on success would leave runs building from an older cache (or from nothing,
      # after a toolchain change) until one passed
      - uses: ./.github/workflows/setup-rust
        with:
          cache: ${{ github.event_name == 'push' && 'write' || 'read' }}
          cache-on-failure: 'true'
          shared-key: build-wasm
      - uses: arduino/setup-protoc@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Builds the wasms natively (incrementally, from the cache) rather than from scratch in
      # docker. Reproducible builds only matter for releases, which still go through docker.
      - name: Build canister wasms and run integration tests
        run: ./scripts/run-integration-tests.sh build
