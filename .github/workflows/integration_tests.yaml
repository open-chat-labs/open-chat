# Runs on every push to master. On PRs the tests are opt in: add the `integration-tests` label to
# run them, after which they re-run on every new commit until the label is removed.
on:
  push:
    branches:
      - master
    paths:
      - "**.rs"
      - "**.toml"
      - "**/Cargo.lock"
      - "scripts/run-integration-tests.sh"
      - "scripts/generate-all-canister-wasms.sh"
      - ".github/workflows/setup-rust/**"
      - ".github/workflows/integration_tests.yaml"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - master
    paths:
      - "**.rs"
      - "**.toml"
      - "**/Cargo.lock"
      - "scripts/run-integration-tests.sh"
      - "scripts/generate-all-canister-wasms.sh"
      - ".github/workflows/setup-rust/**"
      - ".github/workflows/integration_tests.yaml"

name: Integration tests

# Runs that won't execute the tests (PRs without the label, or labelling a PR with some other
# label) get a unique group so they can't cancel a real run. Master pushes also get a unique
# group so that every commit to master is tested.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      (github.event_name == 'pull_request'
        && ((github.event.action == 'labeled' && github.event.label.name == 'integration-tests' && github.event.pull_request.state == 'open')
          || (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'integration-tests'))))
      && github.event.pull_request.number
      || github.run_id }}
  cancel-in-progress: true

jobs:
  integration_tests:
    name: run integration tests
    if: >-
      github.event_name == 'push'
      || (github.event.action == 'labeled' && github.event.label.name == 'integration-tests' && github.event.pull_request.state == 'open')
      || (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'integration-tests'))
    runs-on:
      - runs-on
      - cpu=16
      - image=ubuntu24-full-x64
      - family=m7i
      - run-id=${{ github.run_id }}
    steps:
      - name: Install Rustup
        run: |
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -fsSL "https://sh.rustup.rs" | sh -s -- --default-toolchain none -y
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-rust
        with:
          cache: read
          shared-key: build-wasm
      - uses: arduino/setup-protoc@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Builds the wasms natively (incrementally, from the cache written on master by
      # build_caches.yaml) rather than from scratch in docker. Reproducible builds only matter
      # for releases, which still go through docker.
      - name: Build canister wasms and run integration tests
        run: ./scripts/run-integration-tests.sh build
