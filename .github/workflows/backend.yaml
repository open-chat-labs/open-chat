on:
  pull_request:
    branches:
      - master

name: Backend linting and unit tests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Frontend-only PRs have nothing here to check. The jobs below are required status checks, so
  # they must still run on every PR (a workflow-level `paths:` filter would leave the checks
  # pending and the PR unmergeable); instead they skip themselves when nothing they depend on
  # changed. A skipped job satisfies branch protection.
  #
  # The filter must name every input of these jobs, not just Rust sources. The same block lives
  # in backend.yaml, candid.yaml and benchmarks.yaml; keep the three identical.
  changes:
    name: detect backend changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - "**.rs"
              - "**.toml"
              - "**.did"
              - "**/Cargo.lock"
              - "canbench*.yml"
              - "scripts/**"
              - ".github/workflows/**"

  fmt:
    name: run fmt
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-rust
      - uses: actions-rust-lang/rustfmt@v1

  clippy:
    name: run clippy
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-rust
        with:
          cache: read
      - uses: arduino/setup-protoc@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --workspace --exclude open-chat --exclude tauri-plugin-oc --tests -- -D warnings

  unit_tests:
    name: run unit tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/setup-rust
        with:
          cache: read
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --workspace --exclude integration_tests --exclude open-chat --exclude tauri-plugin-oc
