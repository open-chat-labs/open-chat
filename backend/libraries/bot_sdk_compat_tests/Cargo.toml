[package]
name = "bot_sdk_compat_tests"
version.workspace = true
edition.workspace = true

# Checks the bots SDK (github.com/open-chat-labs/open-chat-bots, `rs/sdk`) still decodes what
# OpenChat sends bots. A backend change adding a kind of content or a field fails here until the
# SDK has it too and `oc_bots_sdk` is bumped to that rev.

[dev-dependencies]
candid = { workspace = true }
ic-ledger-types = { workspace = true }
icrc-ledger-types = { workspace = true }
msgpack = { path = "../msgpack" }
oc_bots_sdk = { workspace = true }
rmpv = { workspace = true }
serde_bytes = { workspace = true }
types = { path = "../types" }
